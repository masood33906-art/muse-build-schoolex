name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build the frontend
        run: npm run build

      - name: Package the Windows installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the installer (single file)
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Split the installer into small parts (for slow connections)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-parts | Out-Null
          & "C:\Program Files\7-Zip\7z.exe" a -v25m "release-parts\SchoolEx-Setup.7z" "release\SchoolEx Setup 1.0.0.exe"

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-1
          path: release-parts/SchoolEx-Setup.7z.001
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-2
          path: release-parts/SchoolEx-Setup.7z.002
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 3
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-3
          path: release-parts/SchoolEx-Setup.7z.003
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 4
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-4
          path: release-parts/SchoolEx-Setup.7z.004
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 5
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-5
          path: release-parts/SchoolEx-Setup.7z.005
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 6
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-6
          path: release-parts/SchoolEx-Setup.7z.006
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 7
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-7
          path: release-parts/SchoolEx-Setup.7z.007
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload part 8
        uses: actions/upload-artifact@v4
        with:
          name: SchoolEx-Setup-part-8
          path: release-parts/SchoolEx-Setup.7z.008
          if-no-files-found: ignore
          retention-days: 90
